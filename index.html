<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Primary SEO Metadata -->
    <title>PayWorth &ndash; Earn Rewards, Complete Campaigns &amp; Manage Your Wallet</title>
    <meta name="description" content="Join PayWorth to complete active campaigns, play secure games, grow your referral network, and manage your cryptographic PWC earning wallet instantly." />
    <link rel="canonical" href="https://payworth.app/" />
    <meta name="robots" content="index, follow" />

    <!-- Google Search Console & Bing Verification Placeholders -->
    <meta name="google-site-verification" content="google-search-console-verification-placeholder-payworth" />
    <meta name="msvalidate.01" content="bing-webmaster-verification-placeholder-payworth" />

    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- iOS Home Screen / Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PayWorth" />

    <!-- Microsoft / Windows Tile Settings -->
    <meta name="msapplication-TileColor" content="#020617" />
    <meta name="msapplication-TileImage" content="/icon-144.png" />
    <meta name="theme-color" content="#10b981" />

    <!-- Open Graph / Facebook / LinkedIn Previews -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://payworth.app/" />
    <meta property="og:title" content="PayWorth &ndash; Earn Rewards, Complete Campaigns &amp; Manage Your Wallet" />
    <meta property="og:description" content="Earn coins by completing campaigns, play instant mini-games, grow your referrals, and cash out securely with PayWorth's central ledger system." />
    <meta property="og:image" content="https://payworth.app/icon-512.png" />
    <meta property="og:site_name" content="PayWorth" />

    <!-- Twitter Card Previews -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://payworth.app/" />
    <meta name="twitter:title" content="PayWorth &ndash; Earn Rewards, Complete Campaigns &amp; Manage Your Wallet" />
    <meta name="twitter:description" content="Join PayWorth's high-fidelity micropayout and ad escrow platform. Earn, refer, and cash out with premium liquid glass interaction." />
    <meta name="twitter:image" content="https://payworth.app/icon-512.png" />
    <meta name="twitter:site" content="@PayWorthApp" />

    <!-- Typography Preloading for CWV (Core Web Vitals) Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-emerald-500 selection:text-slate-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
